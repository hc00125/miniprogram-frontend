name: P0 frontend checks

on:
  push:
    branches:
      - feat/product-order-management
  workflow_dispatch:

jobs:
  mini-program-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build WeChat mini program
        run: npm run build:mp-weixin

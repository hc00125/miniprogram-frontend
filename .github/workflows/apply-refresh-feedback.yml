name: Apply refresh feedback

on:
  push:
    branches:
      - feat/product-order-management
    paths:
      - scripts/apply_refresh_feedback.py

permissions:
  contents: write

jobs:
  apply-refresh-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-order-management
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refresh feedback changes
        run: python scripts/apply_refresh_feedback.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages
          git commit -m "feat: add feedback to manual refresh buttons"
          git push origin HEAD:feat/product-order-management
